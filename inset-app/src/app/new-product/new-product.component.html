<div class="container mt-3">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h3 class="mb-0">Nouveau Produit</h3>
    </div>
    <div class="card-body">
      <form [formGroup]="productForm" (ngSubmit)="saveProduct()">
        <div class="mb-3">
          <label class="form-label">Nom</label>
          <input class="form-control" formControlName="name"
                 [class.is-invalid]="productForm.controls['name'].invalid && productForm.controls['name'].touched">
          @if (productForm.controls['name'].invalid && productForm.controls['name'].touched) {
            <div class="invalid-feedback">Le nom est obligatoire (3 caractères minimum).</div>
          }
        </div>
        <div class="mb-3">
          <label class="form-label">Prix</label>
          <input type="number" class="form-control" formControlName="price"
                 [class.is-invalid]="productForm.controls['price'].invalid && productForm.controls['price'].touched">
          @if (productForm.controls['price'].invalid && productForm.controls['price'].touched) {
            <div class="invalid-feedback">Le prix doit être supérieur à 0.</div>
          }
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" class="form-check-input" id="selected" formControlName="selected">
          <label class="form-check-label" for="selected">Sélectionné</label>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">
          <i class="bi bi-save"></i> Enregistrer
        </button>
      </form>
    </div>
  </div>
</div>
